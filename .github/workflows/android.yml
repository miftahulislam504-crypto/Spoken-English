name: Build Android APK
on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: ['www/**', 'capacitor.config.json', 'package.json']
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm install
      # Real purchases need the Play Billing plugin. It is added only when the repository variable ENABLE_BILLING is set to true
      # (Settings > Secrets and variables > Actions > Variables), so a build never breaks before Play Console is ready.
      - if: ${{ vars.ENABLE_BILLING == 'true' }}
        run: npm install @capgo/native-purchases@^6
      # The admin dashboard is a website tool; it does not belong inside the phone app.
      - run: rm -rf www/admin
      - run: npx cap add android
      - run: sed -i 's#</manifest>#    <uses-permission android:name=\"android.permission.RECORD_AUDIO\" />\n    <uses-permission android:name=\"android.permission.MODIFY_AUDIO_SETTINGS\" />\n    <uses-permission android:name=\"com.android.vending.BILLING\" />\n    <uses-permission android:name=\"android.permission.POST_NOTIFICATIONS\" />\n</manifest>#' android/app/src/main/AndroidManifest.xml
      - run: npx cap sync android
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: spoken-english-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
