name: Release build (signed AAB for Google Play)
# Run by hand: Actions > Release build > Run workflow. It runs every test first, then builds a signed .aab you upload to Play Console (Internal testing).
# Needs four repository secrets (Settings > Secrets and variables > Actions): ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD.
# docs/release.md explains how to make the upload key and the base64 text.
on:
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Version shown to people, for example 0.2.0 (leave empty to use package.json)'
        required: false
        default: ''
jobs:
  aab:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm install
      - run: npm test
      - name: Check the signing secrets exist
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KP: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KA: ${{ secrets.ANDROID_KEY_ALIAS }}
          KK: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          for v in KS KP KA KK; do if [ -z "${!v}" ]; then echo "A signing secret is missing. See docs/release.md."; exit 1; fi; done
      # Real purchases need the Play Billing plugin; a release for testers should always have it.
      - run: npm install @capgo/native-purchases@^6
      - run: rm -rf www/admin
      - run: npx cap add android
      - run: sed -i 's#</manifest>#    <uses-permission android:name=\"android.permission.RECORD_AUDIO\" />\n    <uses-permission android:name=\"android.permission.MODIFY_AUDIO_SETTINGS\" />\n    <uses-permission android:name=\"com.android.vending.BILLING\" />\n    <uses-permission android:name=\"android.permission.POST_NOTIFICATIONS\" />\n</manifest>#' android/app/src/main/AndroidManifest.xml
      - name: Set the version (each upload to Play needs a higher version code)
        env:
          INPUT_VERSION: ${{ github.event.inputs.version_name }}
        run: |
          V="${INPUT_VERSION:-$(node -p "require('./package.json').version")}"
          sed -i "s/versionCode [0-9]*/versionCode ${GITHUB_RUN_NUMBER}/; s/versionName \".*\"/versionName \"${V}\"/" android/app/build.gradle
          grep -n "versionCode\|versionName" android/app/build.gradle
      - run: npx cap sync android
      - run: cd android && chmod +x gradlew && ./gradlew bundleRelease
      - name: Sign the bundle with your upload key
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KP: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KA: ${{ secrets.ANDROID_KEY_ALIAS }}
          KK: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$KS" | base64 -d > "$RUNNER_TEMP/upload.jks"
          cp android/app/build/outputs/bundle/release/app-release.aab spoken-english-release.aab
          jarsigner -keystore "$RUNNER_TEMP/upload.jks" -storepass "$KP" -keypass "$KK" -sigalg SHA256withRSA -digestalg SHA-256 spoken-english-release.aab "$KA"
          jarsigner -verify spoken-english-release.aab | head -3
          rm -f "$RUNNER_TEMP/upload.jks"
      - uses: actions/upload-artifact@v4
        with:
          name: spoken-english-release-aab
          path: spoken-english-release.aab
